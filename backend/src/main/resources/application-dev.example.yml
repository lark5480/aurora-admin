# ============================================================
# 本地开发环境配置（示例模板）
# 复制为 application-dev.yml 后使用
# cp application-dev.example.yml application-dev.yml
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test_ci}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:your_password_here}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    com.aurora.admin: DEBUG
