# ============================================================
# 线上生产环境配置
# 激活方式：--spring.profiles.active=prod
# 所有敏感值通过环境变量注入，不得在此文件写默认值
# ============================================================

spring:
  datasource:
    # 线上建议使用 MySQL Router / ProxySQL 做读写分离，
    # 应用只需连接代理的单一入口，读写路由由代理层处理。
    # 环境变量示例：
    #   DB_HOST=mysql-proxy.internal
    #   DB_PORT=3306
    #   DB_NAME=prod_db
    #   DB_USERNAME=app_user
    #   DB_PASSWORD=<生产密码>
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 10000
  data:
    redis:
      # 集群模式：至少 3 主 3 从 = 6 节点
      # 环境变量示例：
      #   REDIS_CLUSTER_NODES=10.0.1.1:6379,10.0.1.2:6379,10.0.1.3:6379,10.0.1.4:6379,10.0.1.5:6379,10.0.1.6:6379
      #   REDIS_PASSWORD=<集群密码>
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: 3
      password: ${REDIS_PASSWORD}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 4

# 线上日志
logging:
  level:
    com.aurora.admin: INFO
