# ============================================================
# 本地开发环境配置
# 激活方式：默认（spring.profiles.active=dev）
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test_ci}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
  data:
    # 单机方案
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    # 集群方案3主3从
    # redis:
    #   cluster:
    #     nodes: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005
    #   timeout: 3000ms
    #   lettuce:
    #     pool:
    #       max-active: 8
    #       max-idle: 8
    #       min-idle: 2

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2
  elasticsearch:
    uris: http://localhost:9200

# 开发环境日志级别
logging:
  level:
    com.aurora.admin: DEBUG
